<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taller Vini">
<meta name="theme-color" content="#1e3a5f">
<title>TALLER VINI INVENTARIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Vélez Sársfield: azul Francia intenso + blanco */
  --navy:    #003087;
  --blue:    #0043b5;
  --blue-lt: #1a5fcc;
  --sky:     #dce8ff;
  --sky2:    #f0f4ff;
  --white:   #ffffff;
  --slate:   #3d4f6e;
  --slate-lt:#7a8fad;
  --border:  #b8c8e8;
  --border2: #dce8ff;
  --red:     #dc2626;
  --red-lt:  #fee2e2;
  --green:   #16a34a;
  --green-lt:#dcfce7;
  --yellow:  #b45309;
  --yellow-lt:#fef3c7;
  --shadow:  0 1px 3px rgba(0,48,135,.10), 0 1px 2px rgba(0,48,135,.07);
  --shadow-md:0 4px 16px rgba(0,48,135,.16), 0 2px 4px rgba(0,48,135,.10);
  --r: 10px;
  --stripe: repeating-linear-gradient(
    90deg,
    var(--navy) 0px, var(--navy) 18px,
    var(--white) 18px, var(--white) 36px
  );
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body { background: var(--sky2); color: var(--navy); font-family: 'Barlow', sans-serif; min-height: 100vh; }

/* ── HEADER ─────────────────────────────────── */
header {
  background: var(--navy);
  border-bottom: 4px solid var(--white);
  padding: 0 16px;
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: stretch; justify-content: space-between; gap: 10px;
  min-height: 58px;
}
/* franja vertical izquierda estilo camiseta */
header::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 6px;
  background: var(--white);
}
.header-left {
  display: flex; align-items: center; gap: 12px; padding: 10px 0 10px 14px;
}
.header-escudo {
  width: 36px; height: 36px;
  background: var(--white);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem;
  flex-shrink: 0;
  box-shadow: 0 0 0 2px rgba(255,255,255,.3);
}
header h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.45rem; font-weight: 800;
  color: var(--white); letter-spacing: 1px;
  text-transform: uppercase;
  line-height: 1.1;
  display: flex; flex-direction: column;
}
header h1 .sub {
  font-size: 0.65rem; font-weight: 600;
  letter-spacing: 3px; color: rgba(255,255,255,.6);
  text-transform: uppercase;
}
.hstats { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 10px 0; }
.pill {
  background: rgba(255,255,255,.10);
  border: 1px solid rgba(255,255,255,.25);
  padding: 4px 10px; border-radius: 20px;
  font-family: 'DM Mono', monospace; font-size: 0.68rem;
  color: rgba(255,255,255,.75);
  white-space: nowrap;
}
.pill strong { color: #ffffff; }
.pill.red { border-color: rgba(252,165,165,.4); }
.pill.red strong { color: #fca5a5; }
.pill.amber { border-color: rgba(252,211,77,.4); }
.pill.amber strong { color: #fcd34d; }

/* ── AUTH BANNER ─────────────────────────────── */
#auth-banner {
  background: var(--blue);
  color: white;
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  font-size: 0.88rem;
}
#auth-banner.hidden { display: none; }
#auth-banner button {
  background: white; color: var(--blue);
  border: none; padding: 7px 16px; border-radius: 20px;
  font-weight: 700; cursor: pointer; font-size: 0.82rem;
  white-space: nowrap;
}

/* ── BARRA CONTROLES ─────────────────────────── */
.toolbar {
  background: var(--white);
  border-bottom: 1px solid var(--border2);
  padding: 10px 16px;
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  box-shadow: var(--shadow);
}
.search-wrap { position: relative; flex: 1; min-width: 200px; }
.search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--slate-lt); }
input.search {
  width: 100%;
  background: var(--sky2);
  border: 1px solid var(--border);
  color: var(--navy);
  padding: 9px 12px 9px 34px;
  border-radius: var(--r);
  font-family: 'Barlow', sans-serif;
  font-size: 0.9rem;
  outline: none; transition: border-color .2s, box-shadow .2s;
}
input.search:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,67,181,.15); }
input[type=text],input[type=number],select,textarea {
  background: var(--sky2);
  border: 1px solid var(--border);
  color: var(--navy);
  padding: 9px 12px;
  border-radius: var(--r);
  font-family: 'Barlow', sans-serif;
  font-size: 0.9rem;
  outline: none; transition: border-color .2s, box-shadow .2s;
}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus {
  border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,168,.15);
}
.tabs { display: flex; gap: 4px; flex-wrap: wrap; width: 100%; }
.tab {
  padding: 6px 14px; border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--white); color: var(--slate);
  cursor: pointer; font-size: 0.75rem;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; letter-spacing: .5px;
  text-transform: uppercase;
  transition: all .15s; white-space: nowrap;
}
.tab:hover { border-color: var(--blue); color: var(--blue); }
.tab.active { background: var(--navy); color: var(--white); border-color: var(--navy); }
.tab-manage {
  padding: 6px 10px; border-radius: 20px;
  border: 1px dashed var(--border);
  background: transparent; color: var(--slate-lt);
  cursor: pointer; font-size: 0.75rem;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  transition: all .15s; white-space: nowrap;
}
.tab-manage:hover { border-color: var(--blue); color: var(--blue); }

/* ── BOTONES ─────────────────────────────────── */
.btn {
  padding: 9px 16px; border-radius: var(--r);
  border: none; cursor: pointer;
  font-family: 'Barlow', sans-serif;
  font-size: 0.88rem; font-weight: 600;
  transition: all .15s; display: inline-flex;
  align-items: center; gap: 6px; white-space: nowrap;
}
.btn-primary { background: var(--blue); color: var(--white); }
.btn-primary:hover { background: var(--navy); }
.btn-ghost { background: var(--white); border: 1.5px solid var(--border); color: var(--slate); }
.btn-ghost:hover { border-color: var(--blue); color: var(--blue); }
.btn-danger { background: transparent; border: 1.5px solid transparent; color: var(--red); padding: 5px 8px; font-size: 0.8rem; }
.btn-danger:hover { border-color: var(--red); background: var(--red-lt); }
.btn-sm { padding: 5px 10px; font-size: 0.78rem; }
.btn-icon { padding: 8px; border-radius: 8px; }

.view-toggle { display: flex; gap: 4px; }
.vbtn {
  padding: 8px 10px; border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--white); color: var(--slate-lt);
  cursor: pointer; font-size: 1rem; transition: all .15s;
}
.vbtn.active { background: var(--navy); color: var(--white); border-color: var(--navy); }

/* ── MAIN ────────────────────────────────────── */
main { padding: 16px; max-width: 1200px; margin: 0 auto; }

/* ── FORM AGREGAR ────────────────────────────── */
.add-form {
  background: var(--white); border: 1.5px solid var(--blue);
  border-radius: var(--r); padding: 16px;
  margin-bottom: 16px; display: none;
  box-shadow: var(--shadow-md);
}
.add-form.open { display: block; }
.add-form h3 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.15rem; color: var(--navy);
  margin-bottom: 12px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .5px;
}
.form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label { font-size: 0.7rem; color: var(--slate); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

/* ── FOTO PICKER ─────────────────────────────── */
.photo-picker {
  display: flex; gap: 8px; margin-top: 10px; margin-bottom: 4px;
}
.photo-pick-btn {
  flex: 1; padding: 10px; border-radius: var(--r);
  border: 1.5px dashed var(--border);
  background: var(--sky2); color: var(--slate);
  cursor: pointer; font-size: 0.82rem; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all .15s; font-family: 'Barlow', sans-serif;
}
.photo-pick-btn:hover { border-color: var(--blue); color: var(--blue); background: var(--sky); }
.photo-pick-btn.has-photo { border-color: var(--green); color: var(--green); background: var(--green-lt); }
#f-photo-preview {
  width: 60px; height: 60px; border-radius: 8px;
  object-fit: cover; border: 2px solid var(--green);
  display: none;
}

/* ── CARDS ───────────────────────────────────── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
@media(max-width: 480px) { .grid { grid-template-columns: 1fr 1fr; gap: 8px; } }
@media(max-width: 340px) { .grid { grid-template-columns: 1fr; } }

.card {
  background: var(--white);
  border: 1.5px solid var(--border2);
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: box-shadow .2s, border-color .2s, transform .15s;
}
.card:hover { box-shadow: var(--shadow-md); border-color: var(--blue-lt); transform: translateY(-1px); }

.card-img {
  width: 100%; height: 130px;
  background: var(--sky);
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; color: var(--slate-lt);
  position: relative; overflow: hidden;
}
@media(max-width:480px) { .card-img { height: 90px; font-size: 1.5rem; } }
.card-img img {
  width: 100%; height: 100%; object-fit: cover;
  cursor: zoom-in;
}
/* overlay de cámara — solo aparece con hover en el área de ícono vacío o sobre un botón */
.card-img-actions {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent, rgba(30,58,95,.7));
  display: flex; gap: 4px; padding: 6px;
  opacity: 0; transition: opacity .2s;
  justify-content: flex-end;
}
.card-img:hover .card-img-actions { opacity: 1; }
.card-img-actions button {
  background: rgba(255,255,255,.9); border: none;
  border-radius: 6px; padding: 4px 8px;
  font-size: 0.7rem; cursor: pointer; font-weight: 600;
  color: var(--navy);
}
.card-img-actions label {
  background: rgba(255,255,255,.9); border: none;
  border-radius: 6px; padding: 4px 8px;
  font-size: 0.7rem; cursor: pointer; font-weight: 600;
  color: var(--navy);
}
.card-img input[type=file] { display: none; }

.card-lent {
  position: absolute; top: 6px; right: 6px;
  background: var(--yellow-lt); color: var(--yellow);
  border: 1px solid #fcd34d;
  padding: 2px 7px; border-radius: 20px;
  font-size: 0.62rem; font-weight: 600;
  font-family: 'DM Mono', monospace;
}

.card-body { padding: 10px 12px 12px; }
.card-name { font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; line-height: 1.3; color: var(--navy); }
@media(max-width:480px) { .card-name { font-size: 0.78rem; } }
.card-meta { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; }
.cat-badge {
  display: inline-block; padding: 2px 8px; border-radius: 20px;
  font-size: 0.65rem; font-family: 'DM Mono', monospace;
  font-weight: 600; text-transform: uppercase; width: fit-content;
}
.loc-tag { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--blue); display: flex; align-items: center; gap: 3px; }
.lent-tag { font-size: 0.7rem; color: var(--yellow); font-weight: 500; }
.note-tag { font-size: 0.68rem; color: var(--slate-lt); }
.card-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border2); padding-top: 8px; }
.qty-cell { display: flex; align-items: center; gap: 6px; }
.qty-btn {
  width: 26px; height: 26px; border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--white); color: var(--navy);
  cursor: pointer; font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  transition: all .1s; font-weight: 600;
}
.qty-btn:hover, .qty-btn:active { border-color: var(--blue); background: var(--blue); color: white; }
.qty-num { font-family: 'DM Mono', monospace; font-size: 1rem; min-width: 26px; text-align: center; font-weight: 600; }
.qty-low { color: var(--red); }
.qty-ok { color: var(--green); }
.card-actions { display: flex; gap: 2px; }

/* ── TABLA ───────────────────────────────────── */
.table-wrapper { background: var(--white); border: 1.5px solid var(--border2); border-radius: var(--r); overflow: hidden; display: none; box-shadow: var(--shadow); }
.table-wrapper.active { display: block; }
.grid-wrapper { display: none; }
.grid-wrapper.active { display: block; }
table { width: 100%; border-collapse: collapse; }
thead { background: var(--navy); }
th { padding: 11px 14px; text-align: left; font-family: 'Barlow Condensed', sans-serif; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: rgba(255,255,255,.7); cursor: pointer; white-space: nowrap; }
th:hover { color: #a8c4ff; }
tbody tr { border-bottom: 1px solid var(--border2); transition: background .1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--sky2); }
td { padding: 10px 14px; font-size: 0.84rem; vertical-align: middle; color: var(--navy); }
.td-img {
  width: 44px; height: 44px; border-radius: 8px;
  background: var(--sky); display: flex; align-items: center;
  justify-content: center; font-size: 1.1rem; cursor: pointer;
  position: relative; overflow: hidden; flex-shrink: 0;
  border: 1.5px solid var(--border2);
}
.td-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; cursor: zoom-in; }

/* ── MODAL EDITAR ────────────────────────────── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,30,60,.6); z-index: 200; align-items: flex-end; justify-content: center; padding: 0; }
.modal-overlay.open { display: flex; }
.modal {
  background: var(--white);
  border-top: 3px solid var(--blue);
  border-radius: 16px 16px 0 0;
  padding: 20px 16px 32px;
  width: 100%; max-width: 560px;
  max-height: 92vh; overflow-y: auto;
  animation: slideUp .25s ease;
}
@keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 4px; margin: 0 auto 16px; }
.modal h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 1.25rem; color: var(--navy); margin-bottom: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.modal .form-row { flex-direction: column; }
.modal .form-group { width: 100%; }
.modal .form-group input, .modal .form-group select, .modal .form-group textarea { width: 100%; }
.modal-footer { display: flex; gap: 10px; margin-top: 16px; }
.modal-footer .btn { flex: 1; justify-content: center; padding: 12px; }

/* foto en modal editar */
.edit-photo-wrap { margin: 12px 0; }
.edit-photo-current {
  width: 80px; height: 80px; border-radius: 10px;
  object-fit: cover; border: 2px solid var(--border);
  display: block; margin-bottom: 8px;
}
.edit-photo-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.edit-photo-actions label, .edit-photo-actions button {
  padding: 6px 12px; border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--white); color: var(--slate);
  cursor: pointer; font-size: 0.78rem; font-weight: 600;
  font-family: 'Barlow', sans-serif;
  display: inline-flex; align-items: center; gap: 4px;
}
.edit-photo-actions label:hover, .edit-photo-actions button:hover {
  border-color: var(--blue); color: var(--blue);
}

/* ── MODAL FOTO GRANDE ───────────────────────── */
.photo-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 300; align-items: center; justify-content: center; }
.photo-modal.open { display: flex; }
.photo-modal img { max-width: 95vw; max-height: 90vh; border-radius: 10px; }
.photo-modal .close { position: absolute; top: 16px; right: 16px; color: #fff; font-size: 1.8rem; cursor: pointer; background: rgba(255,255,255,.15); border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }

/* ── MODAL CATEGORÍAS ────────────────────────── */
#cat-modal { display: none; position: fixed; inset: 0; background: rgba(15,30,60,.6); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
#cat-modal.open { display: flex; }
.cat-modal-box {
  background: var(--white); border-radius: 16px;
  padding: 20px; width: 100%; max-width: 400px;
  max-height: 80vh; overflow-y: auto;
  box-shadow: var(--shadow-md);
}
.cat-modal-box h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 1.2rem; color: var(--navy); margin-bottom: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.cat-list-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--border2); margin-bottom: 6px;
  font-size: 0.88rem;
}
.cat-list-item .cat-badge-sm {
  display: inline-block; padding: 2px 8px; border-radius: 20px;
  font-size: 0.72rem; font-family: 'DM Mono', monospace;
  font-weight: 600; text-transform: uppercase;
}
.cat-list-item .del-cat {
  background: transparent; border: none;
  color: var(--slate-lt); cursor: pointer; font-size: 1rem;
  padding: 2px 6px; border-radius: 4px;
}
.cat-list-item .del-cat:hover { color: var(--red); background: var(--red-lt); }
.cat-add-row { display: flex; gap: 8px; margin-top: 12px; }
.cat-add-row input { flex: 1; }

/* ── TOAST ───────────────────────────────────── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--navy); color: white;
  padding: 10px 20px; border-radius: 20px;
  font-size: 0.84rem; font-weight: 600;
  font-family: 'Barlow', sans-serif;
  opacity: 0; transition: all .25s; pointer-events: none; z-index: 999;
  white-space: nowrap; box-shadow: var(--shadow-md);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { background: var(--red); }
.toast.ok { background: var(--green); }

/* ── EMPTY ───────────────────────────────────── */
.empty { text-align: center; padding: 50px 20px; color: var(--slate-lt); }
.empty .ico { font-size: 2.5rem; margin-bottom: 10px; }

/* ── FAB ─────────────────────────────────────── */
.fab {
  display: none;
  position: fixed; bottom: 20px; right: 20px; z-index: 90;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--blue); color: white;
  border: none; cursor: pointer;
  font-size: 1.6rem; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(37,99,168,.4);
  transition: all .2s;
}
.fab:active { transform: scale(.93); }
@media(max-width: 600px) { .fab { display: flex; } .add-btn-desktop { display: none; } }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="header-escudo">🔧</div>
    <h1>TALLER VINI<span class="sub">inventario</span></h1>
  </div>
  <div class="hstats">
    <div class="pill">Total: <strong id="s-total">0</strong></div>
    <div class="pill red">Stock bajo: <strong id="s-low">0</strong></div>
    <div class="pill amber">Prestados: <strong id="s-lent">0</strong></div>
  </div>
</header>

<div id="auth-banner">
  <span>🔒 Conectá con Google Drive para sincronizar el inventario</span>
  <button onclick="signIn()">Conectar Drive</button>
</div>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.099zm-5.44 1.406a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/></svg>
    <input type="text" class="search" id="search" placeholder="Buscar herramienta, repuesto…" oninput="render()">
  </div>
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%">
    <div class="tabs" id="cat-tabs"></div>
    <div style="display:flex;gap:6px;margin-left:auto;align-items:center">
      <div class="view-toggle">
        <button class="vbtn active" id="vbtn-grid" onclick="setView('grid')" title="Grilla">⊞</button>
        <button class="vbtn" id="vbtn-table" onclick="setView('table')" title="Tabla">☰</button>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG DRIVE ──────────────────────────────────────────────────────────
const CLIENT_ID = '273718428169-10brvuju5kesu5nak2lcsde1qd2ksofi.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/drive.file';
const FILE_NAME = 'taller-vini-inventario.json';
const LOCAL_KEY = 'taller-v5';

// ── APP STATE ─────────────────────────────────────────────────────────────
let items = [];
let categories = ['Adhesivo','Eléctrico','Fijación','Herramienta','Insumo','Mechas','Medición','Plomería','Repuesto'];
let sortKey = 'name', sortAsc = true, filterCat = 'TODOS', view = 'grid', editId = null;
let driveFileId = null;
let tokenClient = null;
let accessToken = null;
let pendingAddPhoto = '';

// ── PALETA ────────────────────────────────────────────────────────────────
const CATS = {
  'HERRAMIENTA': { bg:'#dbeafe', c:'#1d4ed8' },
  'REPUESTO':    { bg:'#dcfce7', c:'#15803d' },
  'INSUMO':      { bg:'#e0f2fe', c:'#0369a1' },
  'ELECTRICO':   { bg:'#fef3c7', c:'#b45309' },
  'PLOMERIA':    { bg:'#f3e8ff', c:'#7e22ce' },
  'MEDICION':    { bg:'#fce7f3', c:'#be185d' },
  'FIJACION':    { bg:'#ffedd5', c:'#c2410c' },
  'ADHESIVO':    { bg:'#ecfdf5', c:'#065f46' },
  'MECHAS':      { bg:'#f1f5f9', c:'#475569' },
};
function catStyle(cat) {
  const k = cat.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if (CATS[k]) return CATS[k];
  let h = 0; for (let c of cat) h = (h*31+c.charCodeAt(0))&0xffffffff;
  const hue = Math.abs(h)%360;
  return { bg:`hsl(${hue},60%,93%)`, c:`hsl(${hue},60%,30%)` };
}

// ── GOOGLE IDENTITY / DRIVE ───────────────────────────────────────────────
function loadGIS() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: async (resp) => {
      if (resp.error) { toast('Error de autenticación','err'); return; }
      accessToken = resp.access_token;
      document.getElementById('auth-banner').classList.add('hidden');
      toast('✓ Conectado a Drive','ok');
      await loadFromDrive();
    }
  });
}

function signIn() {
  if (!tokenClient) { toast('Cargando SDK…'); return; }
  tokenClient.requestAccessToken();
}

async function driveRequest(url, options={}) {
  const headers = { 'Authorization': `Bearer ${accessToken}`, ...options.headers };
  const res = await fetch(url, { ...options, headers });
  if (res.status === 401) { accessToken = null; document.getElementById('auth-banner').classList.remove('hidden'); throw new Error('Token expirado'); }
  return res;
}

async function findOrCreateFile() {
  // Buscar en appDataFolder primero, luego en Drive general
  const searchUrl = `https://www.googleapis.com/drive/v3/files?q=name%3D'${FILE_NAME}'%20and%20trashed%3Dfalse&fields=files(id,name)&spaces=drive`;
  const res = await driveRequest(searchUrl);
  const data = await res.json();
  if (data.files && data.files.length > 0) {
    driveFileId = data.files[0].id;
    return driveFileId;
  }
  return null;
}

async function loadFromDrive() {
  toast('🔄 Cargando desde Drive…');
  try {
    const fileId = await findOrCreateFile();
    if (!fileId) {
      // Archivo no existe — subir datos locales o vacíos
      toast('⬆️ Creando archivo en Drive…');
      const local = localStorage.getItem(LOCAL_KEY);
      if (local) items = JSON.parse(local);
      await saveToDrive();
      toast('✓ Inventario creado en Drive','ok');
    } else {
      const res = await driveRequest(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
      const payload = await res.json();
      items = payload.items || [];
      if (payload.categories) categories = payload.categories;
      toast('✓ Sincronizado','ok');
    }
    render();
    saveLocal();
  } catch(e) {
    console.error(e);
    toast('⚠️ Error al cargar Drive','err');
    loadLocal();
  }
}

async function saveToDrive() {
  if (!accessToken) { saveLocal(); return; }
  const payload = JSON.stringify({ items, categories });
  try {
    if (!driveFileId) {
      // Crear nuevo archivo
      const meta = { name: FILE_NAME, mimeType: 'application/json' };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(meta)], {type:'application/json'}));
      form.append('file', new Blob([payload], {type:'application/json'}));
      const res = await driveRequest('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
        method: 'POST', body: form
      });
      const d = await res.json();
      driveFileId = d.id;
    } else {
      await driveRequest(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: payload
      });
    }
    saveLocal();
  } catch(e) {
    console.error('Error guardando en Drive:', e);
    toast('⚠️ Error al guardar en Drive','err');
    saveLocal();
  }
}

function saveLocal() {
  localStorage.setItem(LOCAL_KEY, JSON.stringify(items));
  localStorage.setItem(LOCAL_KEY+'-cats', JSON.stringify(categories));
}

function loadLocal() {
  try { items = JSON.parse(localStorage.getItem(LOCAL_KEY)) || []; } catch { items = []; }
  try { const c = localStorage.getItem(LOCAL_KEY+'-cats'); if(c) categories = JSON.parse(c); } catch {}
  render();
}

// ── CATEGORÍAS ────────────────────────────────────────────────────────────
function openCatModal() {
  renderCatModal();
  document.getElementById('cat-modal').classList.add('open');
}
function closeCatModal() {
  document.getElementById('cat-modal').classList.remove('open');
}
function renderCatModal() {
  const list = document.getElementById('cat-modal-list');
  list.innerHTML = categories.map(c => {
    const s = catStyle(c);
    const inUse = items.some(i => i.category === c);
    return `<div class="cat-list-item">
      <span class="cat-badge-sm" style="background:${s.bg};color:${s.c}">${c}</span>
      <button class="del-cat" onclick="deleteCategory('${c}')" title="${inUse?'En uso — se puede eliminar igual':'Eliminar'}">${inUse?'⚠️ ✕':'✕'}</button>
    </div>`;
  }).join('');
}
function addCategory() {
  const inp = document.getElementById('new-cat-input');
  const val = inp.value.trim();
  if (!val) return;
  if (categories.map(c=>c.toLowerCase()).includes(val.toLowerCase())) { toast('Ya existe','err'); return; }
  categories.push(val);
  inp.value = '';
  saveToDrive();
  renderCatModal();
  populateCatSelects();
  tabs();
  toast('✓ Categoría agregada','ok');
}
function deleteCategory(cat) {
  const inUse = items.some(i => i.category === cat);
  if (inUse && !confirm(`La categoría "${cat}" tiene ítems asignados. ¿Eliminar igual?`)) return;
  categories = categories.filter(c => c !== cat);
  saveToDrive();
  renderCatModal();
  populateCatSelects();
  tabs();
  toast('Categoría eliminada');
}
function populateCatSelects() {
  const opts = categories.map(c => `<option value="${c}">${c}</option>`).join('');
  document.getElementById('f-cat').innerHTML = opts;
  document.getElementById('e-cat').innerHTML = opts;
}

// ── FOTO AL AGREGAR ───────────────────────────────────────────────────────
function handleAddPhoto(e) {
  const file = e.target.files[0]; if (!file) return;
  compressImage(file, dataUrl => {
    pendingAddPhoto = dataUrl;
    const prev = document.getElementById('f-photo-preview');
    prev.src = dataUrl; prev.style.display = 'block';
    document.getElementById('f-cam-btn').classList.add('has-photo');
    document.getElementById('f-file-btn').classList.add('has-photo');
  });
}

function compressImage(file, cb) {
  const img = new Image(), reader = new FileReader();
  reader.onload = ev => {
    img.onload = () => {
      const sizes = [{max:400,q:0.65},{max:300,q:0.55},{max:220,q:0.45}];
      const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
      for (const {max,q} of sizes) {
        let w=img.width, h=img.height;
        if(w>h){if(w>max){h=Math.round(h*max/w);w=max;}}else{if(h>max){w=Math.round(w*max/h);h=max;}}
        canvas.width=w; canvas.height=h;
        ctx.clearRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
        const data = canvas.toDataURL('image/jpeg',q);
        if (data.length < 60000) { cb(data); return; }
      }
      cb(canvas.toDataURL('image/jpeg',0.4));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render() {
  const q = document.getElementById('search').value.toLowerCase();
  let data = items.filter(i => {
    const mc = filterCat === 'TODOS' || i.category.toUpperCase() === filterCat.toUpperCase();
    const mq = !q || [i.name,i.location,i.notes,i.lentTo].some(f=>(f||'').toLowerCase().includes(q));
    return mc && mq;
  }).sort((a,b) => {
    let va = a[sortKey]||'', vb = b[sortKey]||'';
    if (sortKey==='qty') { va=+va; vb=+vb; } else { va=va.toLowerCase(); vb=vb.toLowerCase(); }
    return sortAsc ? (va>vb?1:-1) : (va<vb?1:-1);
  });
  view === 'grid' ? renderGrid(data) : renderTable(data);
  stats(); tabs(); lists(); populateCatSelects();
}

function renderGrid(data) {
  const gb = document.getElementById('grid-body'), eg = document.getElementById('empty-grid');
  gb.innerHTML = '';
  if (!data.length) { eg.style.display='block'; return; }
  eg.style.display = 'none';
  data.forEach(item => {
    const s = catStyle(item.category), low = +item.qty <= +item.minQty;
    const d = document.createElement('div'); d.className = 'card';
    d.innerHTML = `
      <div class="card-img">
        ${item.photo
          ? `<img src="${item.photo}" alt="${item.name}" onclick="vp(event,'${item.id}')">`
          : '<span style="font-size:2rem">📷</span>'}
        ${item.lentTo ? `<div class="card-lent">🤝 ${item.lentTo}</div>` : ''}
        <div class="card-img-actions">
          <label title="Cámara">📷 <input type="file" accept="image/*" capture="environment" onchange="up(event,'${item.id}')"></label>
          <label title="Subir">🖼 <input type="file" accept="image/*" onchange="up(event,'${item.id}')"></label>
          ${item.photo ? `<button onclick="delPhoto('${item.id}')">🗑</button>` : ''}
        </div>
      </div>
      <div class="card-body">
        <div class="card-name">${item.name}</div>
        <div class="card-meta">
          <span class="cat-badge" style="background:${s.bg};color:${s.c}">${item.category}</span>
          <span class="loc-tag">📍 ${item.location}</span>
          ${item.notes ? `<span class="note-tag">${item.notes}</span>` : ''}
          ${item.lentTo ? `<span class="lent-tag">🤝 ${item.lentTo}</span>` : ''}
        </div>
        <div class="card-footer">
          <div class="qty-cell">
            <button class="qty-btn" onclick="cq('${item.id}',-1)">−</button>
            <span class="qty-num ${low?'qty-low':'qty-ok'}">${item.qty}</span>
            <button class="qty-btn" onclick="cq('${item.id}',1)">＋</button>
          </div>
          <div class="card-actions">
            <button class="btn btn-ghost btn-sm" onclick="oe('${item.id}')">✏️</button>
            <button class="btn btn-danger" onclick="dl('${item.id}')">✕</button>
          </div>
        </div>
      </div>`;
    gb.appendChild(d);
  });
}

function renderTable(data) {
  const tb = document.getElementById('table-body'), et = document.getElementById('empty-table');
  tb.innerHTML = '';
  if (!data.length) { et.style.display='block'; return; }
  et.style.display = 'none';
  data.forEach(item => {
    const s = catStyle(item.category), low = +item.qty <= +item.minQty;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <div class="td-img">
          ${item.photo ? `<img src="${item.photo}" onclick="vp(event,'${item.id}')">` : '📷'}
        </div>
      </td>
      <td><strong>${item.name}</strong></td>
      <td><span class="cat-badge" style="background:${s.bg};color:${s.c}">${item.category}</span></td>
      <td><span class="loc-tag">📍 ${item.location}</span></td>
      <td>
        <div class="qty-cell">
          <button class="qty-btn" onclick="cq('${item.id}',-1)">−</button>
          <span class="qty-num ${low?'qty-low':'qty-ok'}">${item.qty}</span>
          <button class="qty-btn" onclick="cq('${item.id}',1)">＋</button>
        </div>
      </td>
      <td>${item.lentTo ? `<span class="lent-tag">🤝 ${item.lentTo}</span>` : '<span style="color:#cbd5e1">—</span>'}</td>
      <td style="color:#94a3b8;font-size:.8rem">${item.notes||'—'}</td>
      <td>
        <div style="display:flex;gap:4px">
          <button class="btn btn-ghost btn-sm" onclick="oe('${item.id}')">✏️</button>
          <button class="btn btn-danger" onclick="dl('${item.id}')">✕</button>
        </div>
      </td>`;
    tb.appendChild(tr);
  });
}

function stats() {
  document.getElementById('s-total').textContent = items.length;
  document.getElementById('s-low').textContent = items.filter(i=>+i.qty<=+i.minQty).length;
  document.getElementById('s-lent').textContent = items.filter(i=>i.lentTo).length;
}

function tabs() {
  const cats = ['TODOS', ...new Set(items.map(i=>i.category.toUpperCase()))].sort((a,b)=>a==='TODOS'?-1:a.localeCompare(b));
  document.getElementById('cat-tabs').innerHTML =
    cats.map(c=>`<button class="tab ${c===filterCat.toUpperCase()||( c==='TODOS'&&filterCat==='TODOS')?'active':''}" onclick="setFilter('${c}')">${c}</button>`).join('') +
    `<button class="tab-manage" onclick="openCatModal()" title="Gestionar categorías">⚙️</button>`;
}

function lists() {
  document.getElementById('loc-list').innerHTML = [...new Set(items.map(i=>i.location))].map(l=>`<option value="${l}">`).join('');
  document.getElementById('loc-list2').innerHTML = [...new Set(items.map(i=>i.location))].map(l=>`<option value="${l}">`).join('');
}

// ── ACCIONES ──────────────────────────────────────────────────────────────
async function addItem() {
  const name=document.getElementById('f-name').value.trim();
  const cat=document.getElementById('f-cat').value.trim();
  const loc=document.getElementById('f-loc').value.trim();
  if (!name||!cat||!loc) { toast('Completá nombre, categoría y ubicación','err'); return; }
  const item = {
    id: Date.now().toString(), name, category:cat, location:loc,
    qty: +document.getElementById('f-qty').value,
    minQty: +document.getElementById('f-min').value,
    lentTo: document.getElementById('f-lent').value.trim(),
    notes: document.getElementById('f-notes').value.trim(),
    photo: pendingAddPhoto
  };
  items.push(item);
  pendingAddPhoto = '';
  ['f-name','f-lent','f-notes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-loc').value='';
  document.getElementById('f-qty').value=1; document.getElementById('f-min').value=1;
  document.getElementById('f-photo-preview').style.display='none';
  document.getElementById('f-cam-btn').classList.remove('has-photo');
  document.getElementById('f-file-btn').classList.remove('has-photo');
  document.getElementById('f-photo-cam').value='';
  document.getElementById('f-photo-file').value='';
  await saveToDrive();
  render(); toast('✓ Ítem agregado','ok');
}

async function dl(id) {
  if (!confirm('¿Eliminar este ítem?')) return;
  items = items.filter(i => i.id !== id);
  await saveToDrive();
  render(); toast('Eliminado');
}

async function cq(id,delta) {
  const it = items.find(i=>i.id===id); if (!it) return;
  it.qty = Math.max(0, +it.qty+delta);
  await saveToDrive();
  render();
}

function oe(id) {
  editId=id; const it=items.find(i=>i.id===id);
  document.getElementById('e-name').value=it.name;
  document.getElementById('e-cat').value=it.category;
  document.getElementById('e-loc').value=it.location;
  document.getElementById('e-qty').value=it.qty;
  document.getElementById('e-min').value=it.minQty;
  document.getElementById('e-lent').value=it.lentTo||'';
  document.getElementById('e-notes').value=it.notes||'';
  // foto en modal
  const wrap = document.getElementById('edit-photo-wrap');
  wrap.innerHTML = `
    ${it.photo ? `<img src="${it.photo}" class="edit-photo-current" id="edit-photo-img" onclick="vp(event,'${it.id}')">` : '<div style="color:var(--slate-lt);font-size:.82rem;margin-bottom:8px">Sin foto</div>'}
    <div class="edit-photo-actions">
      <label>📷 Cámara<input type="file" accept="image/*" capture="environment" style="display:none" onchange="upEdit(event)"></label>
      <label>🖼 Subir<input type="file" accept="image/*" style="display:none" onchange="upEdit(event)"></label>
      ${it.photo ? `<button onclick="delPhotoEdit()">🗑 Borrar foto</button>` : ''}
    </div>`;
  document.getElementById('modal').classList.add('open');
}

function upEdit(e) {
  const file = e.target.files[0]; if (!file) return;
  compressImage(file, dataUrl => {
    const it = items.find(i=>i.id===editId); if(!it) return;
    it.photo = dataUrl;
    const img = document.getElementById('edit-photo-img');
    if (img) img.src = dataUrl;
    else document.getElementById('edit-photo-wrap').querySelector('div').textContent='';
  });
}

function delPhotoEdit() {
  const it = items.find(i=>i.id===editId); if(!it) return;
  it.photo = '';
  oe(editId);
}

function closeModal() { document.getElementById('modal').classList.remove('open'); editId=null; }

async function saveEdit() {
  const it=items.find(i=>i.id===editId);
  it.name=document.getElementById('e-name').value.trim();
  it.category=document.getElementById('e-cat').value.trim();
  it.location=document.getElementById('e-loc').value.trim();
  it.qty=+document.getElementById('e-qty').value;
  it.minQty=+document.getElementById('e-min').value;
  it.lentTo=document.getElementById('e-lent').value.trim();
  it.notes=document.getElementById('e-notes').value.trim();
  closeModal();
  await saveToDrive();
  render(); toast('✓ Guardado','ok');
}

async function up(e,id) {
  const file=e.target.files[0]; if (!file) return;
  const it=items.find(i=>i.id===id); if(!it) return;
  compressImage(file, async dataUrl => {
    it.photo = dataUrl;
    await saveToDrive();
    render(); toast('✓ Foto guardada','ok');
  });
}

function delPhoto(id) {
  const it=items.find(i=>i.id===id); if(!it) return;
  it.photo='';
  saveToDrive();
  render(); toast('Foto eliminada');
}

function vp(e,id) {
  e.stopPropagation();
  const it=items.find(i=>i.id===id); if(!it||!it.photo) return;
  document.getElementById('photo-big').src=it.photo;
  document.getElementById('photo-modal').classList.add('open');
}
function closePhoto() { document.getElementById('photo-modal').classList.remove('open'); }
function sortBy(k) { sortKey===k ? sortAsc=!sortAsc : (sortKey=k,sortAsc=true); render(); }
function setFilter(c) {
  filterCat = c;
  render();
}
function toggleForm() {
  const f=document.getElementById('add-form');
  f.classList.toggle('open');
  if(f.classList.contains('open')) { document.getElementById('f-name').focus(); f.scrollIntoView({behavior:'smooth'}); }
}
function setView(v) {
  view=v;
  document.getElementById('grid-wrapper').classList.toggle('active',v==='grid');
  document.getElementById('table-wrapper').classList.toggle('active',v==='table');
  document.getElementById('vbtn-grid').classList.toggle('active',v==='grid');
  document.getElementById('vbtn-table').classList.toggle('active',v==='table');
  render();
}
function exportCSV() {
  const h='Nombre,Categoría,Ubicación,Cantidad,Stock Mínimo,Prestado a,Notas';
  const rows=items.map(i=>[i.name,i.category,i.location,i.qty,i.minQty,i.lentTo||'',i.notes||''].map(v=>`"${v}"`).join(','));
  const blob=new Blob([h+'\n'+rows.join('\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='taller-inventario.csv'; a.click();
}
function toast(msg,type='') {
  const el=document.getElementById('toast'); el.textContent=msg;
  el.className='toast'+(type?' '+type:''); el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}

// ── EXPONER AL HTML ───────────────────────────────────────────────────────
window.addItem=addItem; window.dl=dl; window.cq=cq; window.oe=oe;
window.closeModal=closeModal; window.saveEdit=saveEdit; window.up=up; window.upEdit=upEdit;
window.delPhoto=delPhoto; window.delPhotoEdit=delPhotoEdit; window.vp=vp; window.closePhoto=closePhoto;
window.sortBy=sortBy; window.setFilter=setFilter; window.toggleForm=toggleForm;
window.setView=setView; window.exportCSV=exportCSV; window.signIn=signIn;
window.openCatModal=openCatModal; window.closeCatModal=closeCatModal;
window.addCategory=addCategory; window.deleteCategory=deleteCategory;
window.handleAddPhoto=handleAddPhoto;

// ── BANNER PWA ────────────────────────────────────────────────────────────
(function() {
  if (window.navigator.standalone) return;
  if (window.matchMedia('(display-mode: standalone)').matches) return;
  if (sessionStorage.getItem('pwa-banner-shown')) return;
  sessionStorage.setItem('pwa-banner-shown', '1');
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const banner = document.createElement('div');
  banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#1e3a5f;color:white;padding:14px 16px 20px;display:flex;align-items:flex-start;gap:12px;box-shadow:0 -4px 20px rgba(0,0,0,.3)';
  const msg = isIOS
    ? '<div style="flex:1"><div style="font-weight:700;font-size:.95rem;margin-bottom:4px">📲 Instalar como app</div><div style="font-size:.78rem;opacity:.85;line-height:1.5">Tocá <strong>Compartir</strong> (□↑) en Safari → <strong>"Agregar a inicio"</strong></div></div>'
    : '<div style="flex:1"><div style="font-weight:700;font-size:.95rem;margin-bottom:4px">📲 Instalar como app</div><div style="font-size:.78rem;opacity:.85;line-height:1.5">Menú → <strong>"Agregar a pantalla de inicio"</strong></div></div>';
  banner.innerHTML = msg + '<button onclick="this.parentElement.remove()" style="background:rgba(255,255,255,.15);border:none;color:white;padding:6px 12px;border-radius:20px;cursor:pointer;font-size:.8rem;white-space:nowrap;flex-shrink:0">✕ Cerrar</button>';
  document.body.appendChild(banner);
})();

// ── ARRANQUE ──────────────────────────────────────────────────────────────
window.onload = function() {
  // Cargar local primero (respuesta inmediata)
  loadLocal();
  // Cargar SDK de Google Identity Services
  const script = document.createElement('script');
  script.src = 'https://accounts.google.com/gsi/client';
  script.onload = () => {
    loadGIS();
    // Auto-intentar reconectar si hay token guardado
    const saved = sessionStorage.getItem('gis-token');
    if (saved) { accessToken = saved; document.getElementById('auth-banner').classList.add('hidden'); loadFromDrive(); }
  };
  document.head.appendChild(script);
};
</script>
