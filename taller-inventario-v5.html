<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taller Vini">
<meta name="theme-color" content="#1e3a5f">
<title>TALLER VINI INVENTARIO</title>
<link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22Taller%20Vini%20Inventario%22%2C%22short_name%22%3A%22Taller%20Vini%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%231e3a5f%22%2C%22theme_color%22%3A%22%231e3a5f%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%2520viewBox%3D%270%200%20100%20100%27%253E%253Ctext%2520y%3D%27.9em%27%2520font-size%3D%2790%27%253E%25F0%259F%2594%25A7%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22any%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy:    #1e3a5f;
  --blue:    #2563a8;
  --blue-lt: #3b82d4;
  --sky:     #dbeafe;
  --sky2:    #eff6ff;
  --white:   #ffffff;
  --slate:   #475569;
  --slate-lt:#94a3b8;
  --border:  #cbd5e1;
  --border2: #e2e8f0;
  --red:     #dc2626;
  --red-lt:  #fee2e2;
  --green:   #16a34a;
  --green-lt:#dcfce7;
  --yellow:  #b45309;
  --yellow-lt:#fef3c7;
  --shadow:  0 1px 3px rgba(30,58,95,.08), 0 1px 2px rgba(30,58,95,.06);
  --shadow-md:0 4px 12px rgba(30,58,95,.12), 0 2px 4px rgba(30,58,95,.08);
  --r: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body { background: var(--sky2); color: var(--navy); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

/* ── HEADER ─────────────────────────────────── */
header {
  background: var(--navy);
  padding: 14px 16px;
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
header h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 1.4rem; font-weight: 400;
  color: var(--white); letter-spacing: .3px;
  display: flex; align-items: center; gap: 8px;
}
header h1 .dot { color: #60a5fa; }
.hstats { display: flex; gap: 8px; flex-wrap: wrap; }
.pill {
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.2);
  padding: 4px 10px; border-radius: 20px;
  font-family: 'DM Mono', monospace; font-size: 0.7rem;
  color: rgba(255,255,255,.8);
  white-space: nowrap;
}
.pill strong { color: #93c5fd; }
.pill.red strong { color: #fca5a5; }
.pill.amber strong { color: #fcd34d; }

/* ── BARRA CONTROLES ─────────────────────────── */
.toolbar {
  background: var(--white);
  border-bottom: 1px solid var(--border2);
  padding: 10px 16px;
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  box-shadow: var(--shadow);
}
.search-wrap { position: relative; flex: 1; min-width: 200px; }
.search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--slate-lt); }
input.search {
  width: 100%;
  background: var(--sky2);
  border: 1px solid var(--border);
  color: var(--navy);
  padding: 9px 12px 9px 34px;
  border-radius: var(--r);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  outline: none; transition: border-color .2s, box-shadow .2s;
}
input.search:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,168,.15); }
input[type=text],input[type=number],select,textarea {
  background: var(--sky2);
  border: 1px solid var(--border);
  color: var(--navy);
  padding: 9px 12px;
  border-radius: var(--r);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  outline: none; transition: border-color .2s, box-shadow .2s;
}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus {
  border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,168,.15);
}
.tabs { display: flex; gap: 4px; flex-wrap: wrap; width: 100%; }
.tab {
  padding: 6px 14px; border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--white); color: var(--slate);
  cursor: pointer; font-size: 0.75rem;
  font-family: 'DM Mono', monospace;
  transition: all .15s; white-space: nowrap;
  font-weight: 500;
}
.tab:hover { border-color: var(--blue); color: var(--blue); }
.tab.active { background: var(--navy); color: var(--white); border-color: var(--navy); }

/* ── BOTONES ─────────────────────────────────── */
.btn {
  padding: 9px 16px; border-radius: var(--r);
  border: none; cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.88rem; font-weight: 600;
  transition: all .15s; display: inline-flex;
  align-items: center; gap: 6px; white-space: nowrap;
}
.btn-primary { background: var(--blue); color: var(--white); }
.btn-primary:hover { background: var(--navy); }
.btn-ghost { background: var(--white); border: 1.5px solid var(--border); color: var(--slate); }
.btn-ghost:hover { border-color: var(--blue); color: var(--blue); }
.btn-danger { background: transparent; border: 1.5px solid transparent; color: var(--red); padding: 5px 8px; font-size: 0.8rem; }
.btn-danger:hover { border-color: var(--red); background: var(--red-lt); }
.btn-sm { padding: 5px 10px; font-size: 0.78rem; }
.btn-icon { padding: 8px; border-radius: 8px; }

.view-toggle { display: flex; gap: 4px; }
.vbtn {
  padding: 8px 10px; border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--white); color: var(--slate-lt);
  cursor: pointer; font-size: 1rem; transition: all .15s;
}
.vbtn.active { background: var(--navy); color: var(--white); border-color: var(--navy); }

/* ── MAIN ────────────────────────────────────── */
main { padding: 16px; max-width: 1200px; margin: 0 auto; }

/* ── FORM AGREGAR ────────────────────────────── */
.add-form {
  background: var(--white); border: 1.5px solid var(--blue);
  border-radius: var(--r); padding: 16px;
  margin-bottom: 16px; display: none;
  box-shadow: var(--shadow-md);
}
.add-form.open { display: block; }
.add-form h3 {
  font-family: 'DM Serif Display', serif;
  font-size: 1.05rem; color: var(--navy);
  margin-bottom: 12px; font-weight: 400;
}
.form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label { font-size: 0.7rem; color: var(--slate); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

/* ── CARDS ───────────────────────────────────── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
@media(max-width: 480px) { .grid { grid-template-columns: 1fr 1fr; gap: 8px; } }
@media(max-width: 340px) { .grid { grid-template-columns: 1fr; } }

.card {
  background: var(--white);
  border: 1.5px solid var(--border2);
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: box-shadow .2s, border-color .2s, transform .15s;
}
.card:hover { box-shadow: var(--shadow-md); border-color: var(--blue-lt); transform: translateY(-1px); }

.card-img {
  width: 100%; height: 130px;
  background: var(--sky);
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; color: var(--slate-lt);
  position: relative; overflow: hidden; cursor: pointer;
}
@media(max-width:480px) { .card-img { height: 90px; font-size: 1.5rem; } }
.card-img img { width: 100%; height: 100%; object-fit: cover; }
.card-img .cam-overlay {
  position: absolute; inset: 0;
  background: rgba(30,58,95,.55);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .2s;
  color: white; font-size: 1.2rem; gap: 4px;
}
.card-img .cam-overlay span { font-size: 0.65rem; font-family: 'DM Mono', monospace; letter-spacing: 1px; }
.card-img:hover .cam-overlay, .card-img:active .cam-overlay { opacity: 1; }
.card-img input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }

.card-lent {
  position: absolute; top: 6px; right: 6px;
  background: var(--yellow-lt); color: var(--yellow);
  border: 1px solid #fcd34d;
  padding: 2px 7px; border-radius: 20px;
  font-size: 0.62rem; font-weight: 600;
  font-family: 'DM Mono', monospace;
}

.card-body { padding: 10px 12px 12px; }
.card-name { font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; line-height: 1.3; color: var(--navy); }
@media(max-width:480px) { .card-name { font-size: 0.78rem; } }
.card-meta { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; }
.cat-badge {
  display: inline-block; padding: 2px 8px; border-radius: 20px;
  font-size: 0.65rem; font-family: 'DM Mono', monospace;
  font-weight: 600; text-transform: uppercase; width: fit-content;
}
.loc-tag { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--blue); display: flex; align-items: center; gap: 3px; }
.lent-tag { font-size: 0.7rem; color: var(--yellow); font-weight: 500; }
.note-tag { font-size: 0.68rem; color: var(--slate-lt); }
.card-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border2); padding-top: 8px; }
.qty-cell { display: flex; align-items: center; gap: 6px; }
.qty-btn {
  width: 26px; height: 26px; border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--white); color: var(--navy);
  cursor: pointer; font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  transition: all .1s; font-weight: 600;
}
.qty-btn:hover, .qty-btn:active { border-color: var(--blue); background: var(--blue); color: white; }
.qty-num { font-family: 'DM Mono', monospace; font-size: 1rem; min-width: 26px; text-align: center; font-weight: 600; }
.qty-low { color: var(--red); }
.qty-ok { color: var(--green); }
.card-actions { display: flex; gap: 2px; }

/* ── TABLA ───────────────────────────────────── */
.table-wrapper { background: var(--white); border: 1.5px solid var(--border2); border-radius: var(--r); overflow: hidden; display: none; box-shadow: var(--shadow); }
.table-wrapper.active { display: block; }
.grid-wrapper { display: none; }
.grid-wrapper.active { display: block; }
table { width: 100%; border-collapse: collapse; }
thead { background: var(--navy); }
th { padding: 11px 14px; text-align: left; font-family: 'DM Mono', monospace; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1.5px; color: rgba(255,255,255,.7); cursor: pointer; white-space: nowrap; }
th:hover { color: #93c5fd; }
tbody tr { border-bottom: 1px solid var(--border2); transition: background .1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--sky2); }
td { padding: 10px 14px; font-size: 0.84rem; vertical-align: middle; color: var(--navy); }
.td-img {
  width: 44px; height: 44px; border-radius: 8px;
  background: var(--sky); display: flex; align-items: center;
  justify-content: center; font-size: 1.1rem; cursor: pointer;
  position: relative; overflow: hidden; flex-shrink: 0;
  border: 1.5px solid var(--border2);
}
.td-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
.td-img input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* ── MODAL EDITAR ────────────────────────────── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,30,60,.6); z-index: 200; align-items: flex-end; justify-content: center; padding: 0; }
.modal-overlay.open { display: flex; }
.modal {
  background: var(--white);
  border-top: 3px solid var(--blue);
  border-radius: 16px 16px 0 0;
  padding: 20px 16px 32px;
  width: 100%; max-width: 560px;
  max-height: 92vh; overflow-y: auto;
  animation: slideUp .25s ease;
}
@keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 4px; margin: 0 auto 16px; }
.modal h3 { font-family: 'DM Serif Display', serif; font-size: 1.15rem; color: var(--navy); margin-bottom: 16px; font-weight: 400; }
.modal .form-row { flex-direction: column; }
.modal .form-group { width: 100%; }
.modal .form-group input, .modal .form-group select, .modal .form-group textarea { width: 100%; }
.modal-footer { display: flex; gap: 10px; margin-top: 16px; }
.modal-footer .btn { flex: 1; justify-content: center; padding: 12px; }

/* ── MODAL FOTO GRANDE ───────────────────────── */
.photo-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 300; align-items: center; justify-content: center; }
.photo-modal.open { display: flex; }
.photo-modal img { max-width: 95vw; max-height: 90vh; border-radius: 10px; }
.photo-modal .close { position: absolute; top: 16px; right: 16px; color: #fff; font-size: 1.8rem; cursor: pointer; background: rgba(255,255,255,.15); border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }

/* ── TOAST ───────────────────────────────────── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--navy); color: white;
  padding: 10px 20px; border-radius: 20px;
  font-size: 0.84rem; font-weight: 500;
  opacity: 0; transition: all .25s; pointer-events: none; z-index: 999;
  white-space: nowrap; box-shadow: var(--shadow-md);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { background: var(--red); }
.toast.ok { background: var(--green); }

/* ── EMPTY ───────────────────────────────────── */
.empty { text-align: center; padding: 50px 20px; color: var(--slate-lt); }
.empty .ico { font-size: 2.5rem; margin-bottom: 10px; }

/* ── FAB (botón flotante mobile) ─────────────── */
.fab {
  display: none;
  position: fixed; bottom: 20px; right: 20px; z-index: 90;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--blue); color: white;
  border: none; cursor: pointer;
  font-size: 1.6rem; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(37,99,168,.4);
  transition: all .2s;
}
.fab:active { transform: scale(.93); }
@media(max-width: 600px) { .fab { display: flex; } .add-btn-desktop { display: none; } }
@media(min-width: 601px) { .add-btn-desktop { } }
</style>
</head>
<body>

<header>
  <h1>🔧 TALLER VINI<span class="dot">·</span>INVENTARIO</h1>
  <div class="hstats">
    <div class="pill">Total: <strong id="s-total">0</strong></div>
    <div class="pill red">Bajo stock: <strong id="s-low">0</strong></div>
    <div class="pill amber">Prestados: <strong id="s-lent">0</strong></div>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.099zm-5.44 1.406a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/></svg>
    <input type="text" class="search" id="search" placeholder="Buscar herramienta, repuesto…" oninput="render()">
  </div>
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%">
    <div class="tabs" id="cat-tabs"></div>
    <div style="display:flex;gap:6px;margin-left:auto">
      <div class="view-toggle">
        <button class="vbtn active" id="vbtn-grid" onclick="setView('grid')" title="Grilla">⊞</button>
        <button class="vbtn" id="vbtn-table" onclick="setView('table')" title="Tabla">☰</button>
      </div>
      <button class="btn btn-primary add-btn-desktop" onclick="toggleForm()">＋ Agregar</button>
      <button class="btn btn-ghost btn-sm" onclick="exportCSV()">↓ CSV</button>
    </div>
  </div>
</div>

<main>
  <!-- FORMULARIO -->
  <div class="add-form" id="add-form">
    <h3>➕ Nuevo ítem</h3>
    <div class="form-row">
      <div class="form-group" style="flex:2;min-width:160px"><label>Nombre *</label><input type="text" id="f-name" placeholder="Ej: Martillo Stanley"></div>
      <div class="form-group" style="flex:1;min-width:130px"><label>Categoría *</label><input type="text" id="f-cat" placeholder="Herramienta" list="cat-list"><datalist id="cat-list"></datalist></div>
      <div class="form-group" style="flex:1;min-width:140px"><label>Ubicación *</label><input type="text" id="f-loc" placeholder="Caja Naranja" list="loc-list"><datalist id="loc-list"></datalist></div>
      <div class="form-group"><label>Cant.</label><input type="number" id="f-qty" value="1" min="0" style="width:60px"></div>
      <div class="form-group"><label>Mín.</label><input type="number" id="f-min" value="1" min="0" style="width:60px"></div>
      <div class="form-group" style="flex:1;min-width:120px"><label>Prestado a</label><input type="text" id="f-lent" placeholder="Nombre…"></div>
      <div class="form-group" style="flex:1;min-width:130px"><label>Notas</label><input type="text" id="f-notes" placeholder="Marca, estado…"></div>
      <div class="form-group" style="justify-content:flex-end;gap:6px;flex-direction:row">
        <button class="btn btn-primary" onclick="addItem()">Guardar</button>
        <button class="btn btn-ghost" onclick="toggleForm()">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- GRILLA -->
  <div class="grid-wrapper active" id="grid-wrapper">
    <div class="grid" id="grid-body"></div>
    <div class="empty" id="empty-grid" style="display:none"><div class="ico">🔩</div><p>Sin resultados.</p></div>
  </div>

  <!-- TABLA -->
  <div class="table-wrapper" id="table-wrapper">
    <table>
      <thead><tr>
        <th style="width:56px"></th>
        <th onclick="sortBy('name')">NOMBRE ↕</th>
        <th onclick="sortBy('category')">CATEGORÍA ↕</th>
        <th onclick="sortBy('location')">UBICACIÓN ↕</th>
        <th onclick="sortBy('qty')">CANT. ↕</th>
        <th>PRESTADO A</th>
        <th>NOTAS</th>
        <th></th>
      </tr></thead>
      <tbody id="table-body"></tbody>
    </table>
    <div class="empty" id="empty-table" style="display:none"><div class="ico">🔩</div><p>Sin resultados.</p></div>
  </div>
</main>

<!-- FAB mobile -->
<button class="fab" onclick="toggleForm()" title="Agregar">＋</button>

<!-- MODAL EDITAR -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>✏️ Editar ítem</h3>
    <div class="form-row">
      <div class="form-group"><label>Nombre</label><input type="text" id="e-name"></div>
      <div class="form-group"><label>Categoría</label><input type="text" id="e-cat" list="cat-list"></div>
      <div class="form-group"><label>Ubicación</label><input type="text" id="e-loc" list="loc-list"></div>
      <div class="form-group"><label>Cantidad</label><input type="number" id="e-qty" min="0"></div>
      <div class="form-group"><label>Stock mínimo</label><input type="number" id="e-min" min="0"></div>
      <div class="form-group"><label>Prestado a</label><input type="text" id="e-lent" placeholder="Nombre de quien lo tiene…"></div>
      <div class="form-group"><label>Notas</label><input type="text" id="e-notes"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveEdit()">Guardar cambios</button>
    </div>
  </div>
</div>

<!-- MODAL FOTO GRANDE -->
<div class="photo-modal" id="photo-modal" onclick="closePhoto()">
  <button class="close" onclick="closePhoto()">✕</button>
  <img id="photo-big" src="" alt="">
</div>

<div class="toast" id="toast"></div>

<script>
const KEY = 'taller-v4';
let items = [], sortKey = 'name', sortAsc = true, filterCat = 'TODOS', view = 'grid', editId = null;

// Paleta de categorías
const CATS = {
  'HERRAMIENTA': { bg:'#dbeafe', c:'#1d4ed8' },
  'REPUESTO':    { bg:'#dcfce7', c:'#15803d' },
  'INSUMO':      { bg:'#e0f2fe', c:'#0369a1' },
  'ELECTRICO':   { bg:'#fef3c7', c:'#b45309' },
  'PLOMERIA':    { bg:'#f3e8ff', c:'#7e22ce' },
  'MEDICION':    { bg:'#fce7f3', c:'#be185d' },
  'FIJACION':    { bg:'#ffedd5', c:'#c2410c' },
  'ADHESIVO':    { bg:'#ecfdf5', c:'#065f46' },
  'MECHAS':      { bg:'#f1f5f9', c:'#475569' },
};
function catStyle(cat) {
  const k = cat.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if (CATS[k]) return CATS[k];
  let h = 0; for (let c of cat) h = (h*31+c.charCodeAt(0))&0xffffffff;
  const hue = Math.abs(h)%360;
  return { bg:`hsl(${hue},60%,93%)`, c:`hsl(${hue},60%,30%)` };
}

function load() {
  try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch { items = []; }
  if (!items.length) { items = DATA(); save(); }
}
function save() { localStorage.setItem(KEY, JSON.stringify(items)); }

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  let data = items.filter(i => {
    const mc = filterCat === 'TODOS' || i.category.toUpperCase() === filterCat;
    const mq = !q || [i.name,i.location,i.notes,i.lentTo].some(f=>(f||'').toLowerCase().includes(q));
    return mc && mq;
  }).sort((a,b) => {
    let va = a[sortKey]||'', vb = b[sortKey]||'';
    if (sortKey==='qty') { va=+va; vb=+vb; } else { va=va.toLowerCase(); vb=vb.toLowerCase(); }
    return sortAsc ? (va>vb?1:-1) : (va<vb?1:-1);
  });
  view === 'grid' ? renderGrid(data) : renderTable(data);
  stats(); tabs(); lists();
}

function tabs() {

    `<button class="tab ${c===filterCat?'active':''}" onclick="setFilter('${c}')">${c}</button>`).join('');

function addItem() {
  const name=document.getElementById('f-name').value.trim();
  const cat=document.getElementById('f-cat').value.trim();
  const loc=document.getElementById('f-loc').value.trim();
  if (!name||!cat||!loc) { toast('Completá nombre, categoría y ubicación','err'); return; }
  items.push({ id: Date.now().toString(), name, category:cat, location:loc,
    qty: +document.getElementById('f-qty').value,
    minQty: +document.getElementById('f-min').value,
    lentTo: document.getElementById('f-lent').value.trim(),
    notes: document.getElementById('f-notes').value.trim(), photo:'' });
  save();
  ['f-name','f-cat','f-loc','f-lent','f-notes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-qty').value=1; document.getElementById('f-min').value=1;
  render(); toast('✓ Ítem agregado','ok');
}
function dl(id) {
  if (!confirm('¿Eliminar este ítem?')) return;
  items = items.filter(i=>i.id!==id); save(); render(); toast('Eliminado');
}
function cq(id,d) {
  const it = items.find(i=>i.id===id); if (!it) return;
  it.qty = Math.max(0, +it.qty+d); save(); render();
}
function oe(id) {
  editId=id; const it=items.find(i=>i.id===id);
  document.getElementById('e-name').value=it.name;
  document.getElementById('e-cat').value=it.category;
  document.getElementById('e-loc').value=it.location;
  document.getElementById('e-qty').value=it.qty;
  document.getElementById('e-min').value=it.minQty;
  document.getElementById('e-lent').value=it.lentTo||'';
  document.getElementById('e-notes').value=it.notes||'';
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); editId=null; }
function saveEdit() {
  const it=items.find(i=>i.id===editId);
  it.name=document.getElementById('e-name').value.trim();
  it.category=document.getElementById('e-cat').value.trim();
  it.location=document.getElementById('e-loc').value.trim();
  it.qty=+document.getElementById('e-qty').value;
  it.minQty=+document.getElementById('e-min').value;
  it.lentTo=document.getElementById('e-lent').value.trim();
  it.notes=document.getElementById('e-notes').value.trim();
  closeModal(); save(); render(); toast('✓ Guardado','ok');
}
function up(e,id) {
  const file=e.target.files[0]; if (!file) return;
  const img=new Image(), reader=new FileReader();
  reader.onload=ev=>{
    img.onload=()=>{
      // Intentar con tamaños decrecientes hasta que entre en localStorage
      const sizes=[{max:400,q:0.65},{max:300,q:0.55},{max:220,q:0.45}];
      const canvas=document.createElement('canvas');
      const ctx=canvas.getContext('2d');
      let saved=false;
      const it=items.find(i=>i.id===id); if(!it) return;
      const prev=it.photo;
      for(const {max,q} of sizes){
        let w=img.width, h=img.height;
        if(w>h){if(w>max){h=Math.round(h*max/w);w=max;}}else{if(h>max){w=Math.round(w*max/h);h=max;}}
        canvas.width=w; canvas.height=h;
        ctx.clearRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        it.photo=canvas.toDataURL('image/jpeg',q);
        try { save(); render(); toast('✓ Foto guardada','ok'); saved=true; break; }
        catch(err){ it.photo=prev; }
      }
      if(!saved){ toast('⚠️ Storage lleno. Eliminá fotos de otros ítems primero.','err'); render(); }
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
function delPhoto(id) {
  const it=items.find(i=>i.id===id); if(!it) return;
  it.photo=''; save(); render(); toast('Foto eliminada');
}
function vp(e,id) {
  e.stopPropagation();
  const it=items.find(i=>i.id===id); if(!it||!it.photo) return;
  document.getElementById('photo-big').src=it.photo;
  document.getElementById('photo-modal').classList.add('open');
}
function closePhoto() { document.getElementById('photo-modal').classList.remove('open'); }
function sortBy(k) { sortKey===k ? sortAsc=!sortAsc : (sortKey=k,sortAsc=true); render(); }
function setFilter(c) { filterCat=c; render(); }
function toggleForm() {
  const f=document.getElementById('add-form');
  f.classList.toggle('open');
  if(f.classList.contains('open')) { document.getElementById('f-name').focus(); f.scrollIntoView({behavior:'smooth'}); }
}
function setView(v) {
  view=v;
  document.getElementById('grid-wrapper').classList.toggle('active',v==='grid');
  document.getElementById('table-wrapper').classList.toggle('active',v==='table');
  document.getElementById('vbtn-grid').classList.toggle('active',v==='grid');
  document.getElementById('vbtn-table').classList.toggle('active',v==='table');
  render();
}
function exportCSV() {
  const h='Nombre,Categoría,Ubicación,Cantidad,Stock Mínimo,Prestado a,Notas';
  const rows=items.map(i=>[i.name,i.category,i.location,i.qty,i.minQty,i.lentTo||'',i.notes||''].map(v=>`"${v}"`).join(','));
  const blob=new Blob([h+'\n'+rows.join('\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='taller-inventario.csv'; a.click();
}
function toast(msg,type='') {
  const el=document.getElementById('toast'); el.textContent=msg;
  el.className='toast'+(type?' '+type:''); el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2000);
}

// ── PWA: Service Worker ─────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'taller-vini-v1';
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(['/'])));
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      e.waitUntil(caches.keys().then(keys =>
        Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
      ));
      self.clients.claim();
    });
    self.addEventListener('fetch', e => {
      e.respondWith(caches.match(e.request).then(r => r || fetch(e.request).catch(() =>
        new Response('<h2>Sin conexión – los datos están guardados localmente.</h2>', {headers:{'Content-Type':'text/html'}})
      )));
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}

// ── PWA: Banner de instalación ──────────────────────────────────────────
(function() {
  // Solo mostrar si no está ya instalada como PWA
  if (window.navigator.standalone) return; // ya instalada en iOS
  if (window.matchMedia('(display-mode: standalone)').matches) return;

  // Detectar iOS
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isAndroid = /android/i.test(navigator.userAgent);

  const shown = sessionStorage.getItem('pwa-banner-shown');
  if (shown) return;
  sessionStorage.setItem('pwa-banner-shown', '1');

  const banner = document.createElement('div');
  banner.id = 'pwa-banner';
  banner.style.cssText = `
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999;
    background: #1e3a5f; color: white;
    padding: 14px 16px 20px; display: flex; align-items: flex-start; gap: 12px;
    box-shadow: 0 -4px 20px rgba(0,0,0,.3);
    animation: slideUpBanner .3s ease;
  `;

  let msg = '';
  if (isIOS) {
    msg = `<div style="flex:1">
      <div style="font-weight:700;font-size:.95rem;margin-bottom:4px">📲 Instalar como app</div>
      <div style="font-size:.78rem;opacity:.85;line-height:1.5">Tocá <strong>Compartir</strong> (□↑) en Safari → <strong>"Agregar a inicio"</strong> → tenés la app en tu iPhone</div>
    </div>`;
  } else if (isAndroid) {
    msg = `<div style="flex:1">
      <div style="font-weight:700;font-size:.95rem;margin-bottom:4px">📲 Instalar como app</div>
      <div style="font-size:.78rem;opacity:.85;line-height:1.5">Tocá el menú ⋮ en Chrome → <strong>"Agregar a pantalla de inicio"</strong></div>
    </div>`;
  } else {
    msg = `<div style="flex:1">

      <div style="font-size:.78rem;opacity:.85;line-height:1.5">En el navegador, usá "Agregar a pantalla de inicio" para tener acceso rápido</div>
    </div>`;
  }

  banner.innerHTML = msg + `<button onclick="this.parentElement.remove()" style="background:rgba(255,255,255,.15);border:none;color:white;padding:6px 12px;border-radius:20px;cursor:pointer;font-size:.8rem;white-space:nowrap;flex-shrink:0">✕ Cerrar</button>`;

  style.textContent = `@keyframes slideUpBanner { from { transform: translateY(100%); } to { transform: translateY(0); } }`;
  document.head.appendChild(style);
  document.body.appendChild(banner);
})();
